<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/crest-32.png">
<link rel="apple-touch-icon" href="/img/crest-180.png">
<meta name="theme-color" content="#27236d">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="reg" id="app">
  <header class="top">
    <h1 class="brand"><img class="crest" src="/img/crest-180.png" alt="" width="60" height="60"><span class="brandtx"><small id="league">SE Baseball</small><span id="title">Registration</span></span></h1>
  </header>
  <p class="meta" id="loading">Loading…</p>

  <!-- FORM -->
  <form id="form" hidden novalidate>
    <div class="banner" id="notice" hidden></div>
    <div class="intro" id="intro"></div>

    <section class="regsec guardian">
      <h2>Parent or guardian</h2>
      <div class="fields">
        <label>First name<input type="text" name="gFirst" autocomplete="given-name" required></label>
        <label>Last name<input type="text" name="gLast" autocomplete="family-name" required></label>
        <label>Email<input type="email" name="gEmail" autocomplete="email" required><small>Your receipt goes here.</small></label>
        <label>Mobile phone<input type="tel" name="gPhone" autocomplete="tel" required></label>
        <div class="wide famslot" id="famPanel" aria-live="polite" hidden></div>
        <label class="wide">Street address<input type="text" name="gAddress" autocomplete="street-address"></label>
        <label>City<input type="text" name="gCity" autocomplete="address-level2"></label>
        <label>State<input type="text" name="gState" autocomplete="address-level1" maxlength="20"></label>
        <label>ZIP<input type="text" name="gZip" autocomplete="postal-code" inputmode="numeric" maxlength="10"></label>
      </div>
    </section>

    <section class="playerswrap">
      <h2 class="secttl">Players</h2>
      <div id="players"></div>
      <button type="button" class="addplayer" id="addPlayer">+ Add another player</button>
    </section>

    <section class="regsec" id="familySec" hidden>
      <h2>Your family</h2>
      <div id="familyQs" class="qs"></div>
    </section>

    <section class="regsec summary" aria-label="Summary">
      <h2>Your registration <span class="sub" id="sumCount"></span></h2>
      <div id="summary"></div>
      <fieldset class="choice payplan" id="payChoice" hidden></fieldset>
      <p class="err-text" id="err" role="alert"></p>
      <button type="submit" class="btn primary big" id="submit">Continue to payment</button>
      <p class="note" id="payNote">You'll pay securely on Stripe's checkout page. Nothing is charged until you finish there.</p>
    </section>
  </form>
  <!-- Phones: what's in the registration so far, always in reach -->
  <div class="regbar" id="regbar"><div class="regbar-text" id="regbarText"></div><b class="regbar-total" id="regbarTotal"></b><button type="button" class="btn primary" id="regbarGo">Review</button></div>

  <!-- DONE -->
  <section id="done" hidden></section>
</main>
<script src="/js/register.js"></script>
</body>
</html>
